<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaticSnap</title>
<style>
  :root{--bg:#e9edf2;--ink:#14171f;--rose:#e8325d;--bord:#d5dae1;--gris:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:14px 18px 14px;border-bottom:2px solid var(--bord)}
  h1{margin:0 0 12px;font-size:40px;font-weight:800;letter-spacing:-1px}
  h1 span{color:var(--rose)}
  nav{display:flex;gap:10px;flex-wrap:wrap}
  .tab{border:2px solid var(--bord);background:#fff;color:var(--ink);border-radius:999px;padding:11px 24px;font-size:18px;font-weight:600;cursor:pointer}
  .tab.actif{background:var(--rose);border-color:var(--rose);color:#fff}
  #btnAuth{background:#f5f7fa;color:var(--gris)}
  main{padding:18px;max-width:560px;margin:0 auto}
  h2{font-size:28px;margin:18px 0 16px;font-weight:800}
  .vide{border:2px dashed var(--bord);border-radius:22px;padding:34px 20px;text-align:center;color:var(--gris);font-size:19px;line-height:1.6}
  .post{background:#fff;border-radius:18px;padding:14px;margin:0 0 18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .auteur{display:flex;align-items:center;gap:10px;font-weight:700}
  .auteur img{width:38px;height:38px;border-radius:50%}
  .media{display:block;width:100%;margin-top:12px;border-radius:12px;background:#000}
  .post p{margin:12px 0 2px;font-size:16px}
  .carte{background:#fff;border-radius:18px;padding:18px}
  .carte input[type=text]{width:100%;padding:13px;margin:10px 0;border:2px solid var(--bord);border-radius:12px;font-size:16px;background:#fff;color:var(--ink)}
  .carte input[type=file]{width:100%;margin:6px 0}
  .go{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:13px 28px;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
  .go:disabled{opacity:.5}
  #msg{min-height:22px;margin:12px 0 0;color:#c0392b;font-size:15px}
  #msg.ok{color:#1e8e4e}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Matic<span>Snap</span></h1>
  <nav>
    <button class="tab actif" id="tabFil">Fil</button>
    <button class="tab" id="tabPub">Publier</button>
    <button class="tab" id="btnAuth">Connexion…</button>
  </nav>
</header>

<main>
  <p id="msg"></p>

  <section id="vueFil">
    <h2>Les dernières publications</h2>
    <div id="feed"><div class="vide">Chargement…</div></div>
  </section>

  <section id="vuePub" hidden>
    <h2>Publier</h2>
    <div class="carte" id="formPub" hidden>
      <input type="file" id="fichier" accept="image/*,video/*">
      <input type="text" id="legende" placeholder="Légende (facultatif)" maxlength="200">
      <button class="go" id="btnPublier">Publier</button>
    </div>
    <div class="vide" id="aConnecter" hidden>
      Connecte-toi avec Google pour publier.<br><br>
      <button class="go" id="btnAuth2">Se connecter avec Google</button>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, limit, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ====== À REMPLIR avec tes valeurs Cloudinary ======
const CLOUDINARY_CLOUD_NAME = "COLLE_TON_CLOUD_NAME";
const CLOUDINARY_UPLOAD_PRESET = "COLLE_TON_UPLOAD_PRESET";
// ====================================================

const app = initializeApp({
  apiKey: "AIzaSyBFb_NwxrfimsVSlXAM2fm0icMbTsmvBC8",
  authDomain: "zenith-5a212.firebaseapp.com",
  projectId: "zenith-5a212",
  storageBucket: "zenith-5a212.firebasestorage.app",
  messagingSenderId: "811680674432",
  appId: "1:811680674432:web:b9b4176f75ca04a36a2c65"
});

const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const $ = (id) => document.getElementById(id);
const msg = $("msg");
let utilisateur = null;

function dire(texte, ok) { msg.textContent = texte; msg.className = ok ? "ok" : ""; }

// Onglets
function montrer(vue) {
  $("vueFil").hidden = vue !== "fil";
  $("vuePub").hidden = vue !== "pub";
  $("tabFil").classList.toggle("actif", vue === "fil");
  $("tabPub").classList.toggle("actif", vue === "pub");
  dire("");
}
$("tabFil").onclick = () => montrer("fil");
$("tabPub").onclick = () => montrer("pub");

// Connexion Google
async function connecter() {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      signInWithRedirect(auth, provider);
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      dire("Erreur : " + e.code);
    }
  }
}
$("btnAuth").onclick = () => { if (utilisateur) signOut(auth); else connecter(); };
$("btnAuth2").onclick = connecter;
getRedirectResult(auth).catch(e => dire("Erreur : " + e.code));

onAuthStateChanged(auth, (user) => {
  utilisateur = user;
  $("btnAuth").textContent = user ? "Déconnexion" : "Se connecter";
  $("formPub").hidden = !user;
  $("aConnecter").hidden = !!user;
});

// Publier : fichier vers Cloudinary, puis enregistrement dans Firestore
$("btnPublier").onclick = async () => {
  dire("");
  const fichier = $("fichier").files[0];
  if (!utilisateur) { dire("Connecte-toi d’abord."); return; }
  if (!fichier) { dire("Choisis une photo ou une vidéo."); return; }
  if (fichier.size > 50 * 1024 * 1024) { dire("Fichier trop lourd (50 Mo maximum)."); return; }
  if (CLOUDINARY_CLOUD_NAME.startsWith("COLLE")) { dire("Cloudinary n’est pas encore configuré."); return; }

  const bouton = $("btnPublier");
  bouton.disabled = true;
  dire("Envoi en cours…", true);
  try {
    const fd = new FormData();
    fd.append("file", fichier);
    fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    const rep = await fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload", { method: "POST", body: fd });
    const data = await rep.json();
    if (!rep.ok) throw new Error((data.error && data.error.message) || "Échec de l’envoi");

    await addDoc(collection(db, "posts"), {
      url: data.secure_url,
      type: data.resource_type === "video" ? "video" : "image",
      legende: $("legende").value.trim(),
      uid: utilisateur.uid,
      nom: utilisateur.displayName || "Anonyme",
      photo: utilisateur.photoURL || "",
      createdAt: serverTimestamp()
    });
    $("fichier").value = "";
    $("legende").value = "";
    montrer("fil");
    dire("Publié !", true);
  } catch (e) {
    dire("Erreur : " + (e.message || e.code));
  }
  bouton.disabled = false;
};

// Fil des publications, visible par tout le monde, en direct
function afficherVide() {
  const feed = $("feed");
  feed.textContent = "";
  const v = document.createElement("div");
  v.className = "vide";
  v.append("Aucune publication pour l’instant.", document.createElement("br"), "Publie la première.");
  feed.appendChild(v);
}

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(30));
onSnapshot(q, (snap) => {
  const feed = $("feed");
  if (snap.empty) { afficherVide(); return; }
  feed.textContent = "";
  snap.forEach((d) => {
    const p = d.data();
    const carte = document.createElement("div");
    carte.className = "post";

    const auteur = document.createElement("div");
    auteur.className = "auteur";
    if (p.photo) {
      const av = document.createElement("img");
      av.src = p.photo; av.alt = "";
      auteur.appendChild(av);
    }
    const nom = document.createElement("span");
    nom.textContent = p.nom || "Anonyme";
    auteur.appendChild(nom);
    carte.appendChild(auteur);

    let media;
    if (p.type === "video") {
      media = document.createElement("video");
      media.controls = true;
      media.playsInline = true;
      media.preload = "metadata";
    } else {
      media = document.createElement("img");
      media.alt = "";
      media.loading = "lazy";
    }
    media.className = "media";
    media.src = p.url;
    carte.appendChild(media);

    if (p.legende) {
      const l = document.createElement("p");
      l.textContent = p.legende;
      carte.appendChild(l);
    }
    feed.appendChild(carte);
  });
}, (e) => {
  afficherVide();
  dire("Le fil n’est pas encore disponible (" + e.code + "). Vérifie que Firestore est créé.");
});
</script>
</body>
</html>
