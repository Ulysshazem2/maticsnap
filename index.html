<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaticSnap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{--bg:#e9edf1;--panel:#fff;--ink:#161b22;--mute:#5d6875;--frame:#fff;--line:#cfd6de;--acc:#e8365d;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--panel:#171c23;--ink:#eef1f4;--mute:#97a2b0;--frame:#f1f4f7;--line:#2a323d;--acc:#ff5a7e}}
:root[data-theme="dark"]{--bg:#0f1318;--panel:#171c23;--ink:#eef1f4;--mute:#97a2b0;--frame:#f1f4f7;--line:#2a323d;--acc:#ff5a7e}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.logo{font:800 26px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}.logo span{color:var(--acc)}
nav{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 16px}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on,button.main{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h2{font:800 22px/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 14px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.snap{background:var(--frame);color:#161b22;padding:10px 10px 0;border-radius:3px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.snap:nth-child(odd){transform:rotate(-.8deg)}.snap:nth-child(even){transform:rotate(.7deg)}
.snap img,.snap video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#222}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px 10px}
.bar p{margin:0;min-width:0}.cap{font-weight:700;overflow-wrap:anywhere}.by{font-size:13px;color:#5d6875}
.act{display:flex;gap:4px}.act button{border:0;background:transparent;color:#161b22;padding:6px 8px;font-size:15px}
.act button.liked{color:var(--acc);font-weight:700}
.empty,.note{border:2px dashed var(--line);border-radius:12px;padding:24px 20px;text-align:center;color:var(--mute)}
.note{margin-bottom:18px;border-style:solid;color:var(--ink)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;max-width:520px}
label{display:grid;gap:6px;font-weight:600}
input[type=text]{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=file]{font:inherit;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.prev{background:var(--frame);padding:10px;border-radius:3px;max-width:340px;display:none}
.prev img,.prev video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.hint{color:var(--mute);font-size:14px;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
<h1 class="logo">Matic<span>Snap</span></h1>
<nav><button id="tFeed" class="on">Fil</button><button id="tPub">Publier</button><button id="tAuth">Connexion…</button></nav>
</header>
<main>
<div id="note" class="note" hidden role="status"></div>
<section id="vFeed"><h2>Les dernières publications</h2><div id="feed" class="feed"></div></section>
<section id="vPub" hidden>
<h2>Publier une photo ou une vidéo</h2>
<div class="form">
<label>Photo ou vidéo<input id="file" type="file" accept="image/*,video/*"></label>
<p class="hint">Vidéo : 20 Mo maximum, format MP4 recommandé.</p>
<div id="prev" class="prev"><img id="pimg" alt="Aperçu" hidden><video id="pvid" controls playsinline muted hidden></video></div>
<div class="chips" id="chips" role="group" aria-label="Filtre"></div>
<label>Légende<input id="cap" type="text" maxlength="60" placeholder="Coucher de soleil à Libreville"></label>
<button class="main" id="go">Publier</button>
<p class="hint" id="msg" role="status"></p>
</div>
</section>
</main>
<script>
(async function(){
var FIL={none:"",vintage:"sepia(.55) contrast(1.1) saturate(1.2)",noir:"grayscale(1) contrast(1.2)",chaud:"saturate(1.4) hue-rotate(-12deg) brightness(1.05)"},NOM={none:"Original",vintage:"Vintage",noir:"Noir",chaud:"Chaud"};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var me=null,names={},snaps=[],likes=[],fil="none",img=null,vid=null,kind=null,db=null,assets=null,user=null;
function note(t){$("note").hidden=!t;$("note").textContent=t||""}
function msg(t){$("msg").textContent=t||""}
function show(v){$("vFeed").hidden=v!=="feed";$("vPub").hidden=v!=="pub";$("tFeed").className=v==="feed"?"on":"";$("tPub").className=v==="pub"?"on":"";if(v==="pub"&&!me)note("Publier demande un compte avec accès contributeur sur cette page.");else note("")}
$("chips").innerHTML=Object.keys(FIL).map(function(k){return '<button type="button" data-f="'+k+'" class="'+(k==="none"?"on":"")+'">'+NOM[k]+'</button>'}).join("");
$("chips").onclick=function(e){var k=e.target.getAttribute("data-f");if(!k)return;fil=k;Array.prototype.forEach.call($("chips").children,function(b){b.className=b.getAttribute("data-f")===k?"on":""});$("pimg").style.filter=FIL[k];$("pvid").style.filter=FIL[k]};
$("tFeed").onclick=function(){show("feed")};$("tPub").onclick=function(){show("pub")};
function render(){
 var f=$("feed");
 if(!snaps.length){f.innerHTML='<div class="empty" style="grid-column:1/-1">Aucune publication pour l’instant. Publie la première.</div>';return}
 f.innerHTML=snaps.map(function(p){
  var st=' style="filter:'+(FIL[p.fil]||"")+'"',m="";
  if(p.kind==="video"&&/^[0-9a-f]{32}$/.test(p.aid||""))m='<video src="/_blob/'+p.aid+'" controls playsinline preload="metadata"'+st+'></video>';
  else if(/^data:image\//.test(p.src||""))m='<img src="'+p.src+'" alt="'+esc(p.cap||"Photo")+'"'+st+'>';
  else return "";
  var ls=likes.filter(function(l){return l.post===p.id}),liked=me&&ls.some(function(l){return l.uid===me}),own=me&&me===p.uid,nm=(names[p.uid]&&names[p.uid].name)||"un membre";
  return '<article class="snap">'+m+'<div class="bar"><p><span class="cap">'+esc(p.cap||"Sans légende")+'</span><br><span class="by">par '+esc(nm)+'</span></p><div class="act"><button data-l="'+p.id+'" class="'+(liked?"liked":"")+'" aria-label="J’aime">♥ '+ls.length+'</button>'+(own?'<button data-d="'+p.id+'">Supprimer</button>':"")+'</div></div></article>'}).join("")}
$("feed").onclick=async function(e){
 var l=e.target.getAttribute("data-l"),d=e.target.getAttribute("data-d");
 try{
  if(l){if(!me){note("Il faut un accès contributeur pour aimer une publication.");return}
   var ref=db.doc("likes/"+l+"_"+me);
   if(likes.some(function(x){return x.post===l&&x.uid===me}))await ref.delete();else await ref.set({post:l,uid:me})}
  if(d){var p=snaps.filter(function(x){return x.id===d})[0];await db.doc("snaps/"+d).delete();if(p&&p.aid&&assets){try{await assets.delete(p.aid)}catch(x){}}}
 }catch(x){note("Action impossible. Réessaie dans un instant.")}};
$("file").onchange=function(){
 var f=$("file").files[0];img=vid=kind=null;$("prev").style.display="none";msg("");if(!f)return;
 if(f.type.indexOf("image/")===0){
  var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,640/i.width),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);
   img=c.toDataURL("image/jpeg",.65);kind="photo";$("pimg").src=img;$("pimg").hidden=false;$("pvid").hidden=true;$("pimg").style.filter=FIL[fil];$("prev").style.display="block"};
   i.onerror=function(){msg("Image illisible. Choisis un fichier JPG ou PNG.")};i.src=r.result};r.readAsDataURL(f)}
 else if(f.type.indexOf("video/")===0){
  if(f.size>20*1024*1024){msg("Vidéo trop lourde : 20 Mo maximum.");$("file").value="";return}
  vid=f;kind="video";$("pvid").src=URL.createObjectURL(f);$("pvid").hidden=false;$("pimg").hidden=true;$("pvid").style.filter=FIL[fil];$("prev").style.display="block"}
 else msg("Format non pris en charge. Choisis une photo ou une vidéo.")};
$("go").onclick=async function(){
 if(!me||!db){note("Publier demande un compte avec accès contributeur sur cette page.");return}
 if(!kind){msg("Choisis d’abord une photo ou une vidéo.");return}
 if(kind==="video"&&!assets){msg("L’envoi de vidéos n’est pas disponible avec ton accès. Les photos fonctionnent.");return}
 $("go").disabled=true;
 try{
  var base={uid:me,cap:$("cap").value.trim().slice(0,60),fil:fil,kind:kind,createdAt:Date.now()};
  if(kind==="photo")await db.collection("snaps").add(Object.assign(base,{src:img}));
  else{msg("Envoi en cours…");var r=await assets.upload(vid);await db.collection("snaps").add(Object.assign(base,{aid:r.id}))}
  $("file").value="";$("cap").value="";img=vid=kind=null;$("prev").style.display="none";msg("");show("feed")
 }catch(e){msg("Publication impossible. Vérifie ta connexion et tes droits sur cette page.")}finally{$("go").disabled=false}};
$("tAuth").disabled=true;$("tAuth").textContent="Connexion…";render();
db=await claude.use("db");user=await claude.use("user");assets=await claude.use("assets");
if(!db){$("tAuth").textContent="Hors ligne";note("Le fil partagé n’est pas disponible ici. Ouvre la page depuis claude.ai.");return}
if(user){try{me=await user.id();var pr=await user.profiles([me]);$("tAuth").textContent=me?"Connecté : "+(((pr[me]&&pr[me].name)||"moi").split(" ")[0]):"Lecture seule"}catch(e){$("tAuth").textContent="Lecture seule"}}else $("tAuth").textContent="Lecture seule";
db.collection("snaps").orderBy("createdAt","desc").limit(40).onSnapshot(async function(s){
 snaps=s.docs.map(function(x){var d=x.data();d.id=x.id;return d});
 var ids=[];snaps.forEach(function(p){if(p.uid&&ids.indexOf(p.uid)<0)ids.push(p.uid)});
 if(user&&ids.length){try{names=await user.profiles(ids)}catch(e){}}
 render()},function(){note("Impossible de charger le fil. Réessaie.")});
db.collection("likes").onSnapshot(function(s){likes=s.docs.map(function(x){return x.data()});render()},function(){});
})();
</script>
</body>
</html>
